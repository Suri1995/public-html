<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login - Amma Eye Care Hospital</title>
  <link rel="stylesheet" href="../assets/css/style.css">
  <style>
    .login-container {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #1e3a8a 0%, #3b82f6 100%);
      padding: 20px;
    }
    .login-card {
      background: white;
      padding: 40px;
      border-radius: 12px;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.1);
      width: 100%;
      max-width: 400px;
    }
    .login-header {
      text-align: center;
      margin-bottom: 30px;
    }
    .login-header img {
      max-width: 200px;
      margin-bottom: 20px;
    }
    .login-header h1 {
      font-size: 24px;
      color: #1e3a8a;
      margin-bottom: 8px;
    }
    .login-header p {
      color: #64748b;
      font-size: 14px;
    }
  </style>
</head>
<body>
  <div class="login-container">
    <div class="login-card">
      <div class="login-header">
        <img src="../public/logo-amma.png" alt="Amma Eye Care Hospital">
        <h1>Admin Panel</h1>
        <p>Login to manage appointments and consultations</p>
      </div>

      <form id="loginForm">
        <div class="form-group">
          <label for="username">Username</label>
          <input type="text" id="username" name="username" required>
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" name="password" required>
        </div>

        <div id="loginMessage" class="form-message"></div>

        <button type="submit" class="btn btn-primary btn-full" id="loginBtn">
          <span id="btnText">Login</span>
          <span id="btnLoader" class="btn-loader" style="display: none;"></span>
        </button>
      </form>
    </div>
  </div>

  <script>
    document.getElementById('loginForm').addEventListener('submit', async function(e) {
      e.preventDefault();
      
      const loginBtn = document.getElementById('loginBtn');
      const btnText = document.getElementById('btnText');
      const btnLoader = document.getElementById('btnLoader');
      const loginMessage = document.getElementById('loginMessage');
      
      loginBtn.disabled = true;
      btnText.style.display = 'none';
      btnLoader.style.display = 'inline-block';
      loginMessage.textContent = '';
      loginMessage.className = 'form-message';
      
      const formData = new FormData(this);
      
      try {
        const response = await fetch('../api/admin-login.php', {
          method: 'POST',
          body: formData
        });
        
        const result = await response.json();
        
        if (result.success) {
          loginMessage.textContent = 'Login successful! Redirecting...';
          loginMessage.className = 'form-message success';
          setTimeout(() => {
            window.location.href = 'dashboard.html';
          }, 1000);
        } else {
          loginMessage.textContent = result.message || 'Invalid credentials. Please try again.';
          loginMessage.className = 'form-message error';
        }
      } catch (error) {
        loginMessage.textContent = 'An error occurred. Please try again later.';
        loginMessage.className = 'form-message error';
      } finally {
        loginBtn.disabled = false;
        btnText.style.display = 'inline';
        btnLoader.style.display = 'none';
      }
    });
  </script>
</body>
</html>
